# Publica la página en GitHub Pages cada vez que se sube un cambio a main.
# Arma una carpeta "pública" SIN la administración (admin.html), el LEEME, el logo original
# y los respaldos: eso queda solo en el repositorio, nunca en el sitio publicado.
name: Publicar la página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar la carpeta pública
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='admin.html' --exclude='LEEME.txt' --exclude='.gitignore' \
            --exclude='*.respaldo.js' --exclude='img/logo/original' --exclude='*.md' \
            ./ _site/
          touch _site/.nojekyll
          test ! -e _site/admin.html   # si la admin llegara a copiarse, el trabajo falla y no se publica

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
